name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Integration tests need real Postgres: the schema uses pgvector, ARRAY and
    # a generated tsvector column that no in-memory database implements. They
    # skip when MEETINGIQ_TEST_DATABASE_URL is unset, so this service is what
    # makes them actually run.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: meetingiq
          POSTGRES_PASSWORD: meetingiq
          POSTGRES_DB: meetingiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetingiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version in api/Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        env:
          MEETINGIQ_TEST_DATABASE_URL: postgresql+psycopg://meetingiq:meetingiq@localhost:5432/meetingiq_test
        run: pytest -q

      # A skipped integration test looks identical to a passing one in the
      # summary line, so assert they actually ran.
      - name: Assert integration tests were not skipped
        env:
          MEETINGIQ_TEST_DATABASE_URL: postgresql+psycopg://meetingiq:meetingiq@localhost:5432/meetingiq_test
        run: |
          output=$(pytest tests/test_ingest_pipeline.py -q --no-header)
          echo "$output"
          if echo "$output" | grep -q "skipped"; then
            echo "::error::Integration tests skipped — the Postgres service is not reachable."
            exit 1
          fi

      - name: Check migrations match the models
        env:
          MEETINGIQ_DATABASE_URL: postgresql+psycopg://meetingiq:meetingiq@localhost:5432/meetingiq_test
        run: |
          alembic upgrade head
          # Autogenerate against an up-to-date database must produce no changes;
          # a non-empty diff means the models and migrations have drifted.
          alembic check

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Required for the GitHub Actions cache backend below: the default docker
      # driver cannot export a cache.
      - uses: docker/setup-buildx-action@v3

      # The API image is not the local dev path, but it is the artifact that
      # would deploy to Fargate. Building it here stops it rotting unnoticed.
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
