[project]
name = "meetingiq"
version = "0.1.0"
description = "Meeting Intelligence System — RAG over meeting transcripts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetingiq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so tests can import shared helpers from tests.conftest.
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    # Deprecations in our own code should fail the build, not scroll past.
    "error::DeprecationWarning",
    # Starlette's TestClient warns about httpx vs httpx2; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
